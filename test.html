<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmailJS Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>

  <script>
    console.log('=== EMAILJS TEST ===');
    console.log('typeof emailjs:', typeof emailjs);
    console.log('window.emailjs:', window.emailjs);

    if (typeof emailjs === 'undefined') {
      console.error('❌ EMAILJS FAILED TO LOAD');
    } else {
      console.log('✅ EMAILJS LOADED');

      emailjs.init({
        publicKey: 'lO6vTEZJ3VJqSqF0t'
      });

      console.log('✅ EMAILJS INITIALIZED');
    }
  </script>
</head>

<body>

  <h1>EmailJS Test</h1>

</body>
</html>
